# Network and Ports
# -------------------------
OLLAMA_PORT="11434"
BACKEND_PORT="8000"
FRONTEND_PORT="80"
VITE_DEV_PORT="5173"
OLLAMA_HOST="ollama"
BACKEND_HOST="danilo_backend"

