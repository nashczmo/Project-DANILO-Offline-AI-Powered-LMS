# Project DANILO Centralized Configuration
# This file contains all configurable thresholds, ports, URLs, and AI models.
# It replaces previously hardcoded magic values in the bash scripts.

# -------------------------
# Network and Ports
# -------------------------
OLLAMA_PORT="11434"
BACKEND_PORT="8000"
FRONTEND_PORT="80"
VITE_DEV_PORT="5173"
OLLAMA_HOST="ollama"
BACKEND_HOST="danilo_backend"
DANILO_LAN_IP="10.10.0.1"
DANILO_LAN_PREFIX="24"
DANILO_DHCP_RANGE_START="10.10.0.10"
DANILO_DHCP_RANGE_END="10.10.0.200"
DANILO_PORTAL_DOMAIN="danilo.apc.edu.ph"

# -------------------------
# AI Models (Tiers A-G)
# -------------------------
DANILO_AI_MODEL_TIER_A="phi3:mini"
DANILO_AI_MODEL_TIER_B="llama3.2:3b"
DANILO_AI_MODEL_TIER_C="llama3.1:8b"
DANILO_AI_MODEL_TIER_D="mistral-nemo:12b"
DANILO_AI_MODEL_TIER_E="qwen2.5:14b"
DANILO_AI_MODEL_TIER_F="qwen2.5:32b"
DANILO_AI_MODEL_TIER_G="llama3.3:70b"

DANILO_AI_FALLBACK_TIER_A="llama3.2:1b"
DANILO_AI_FALLBACK_TIER_B="phi3:mini"
DANILO_AI_FALLBACK_TIER_C="llama3.2:3b"
DANILO_AI_FALLBACK_TIER_D="llama3.1:8b"
DANILO_AI_FALLBACK_TIER_E="mistral-nemo:12b"
DANILO_AI_FALLBACK_TIER_F="qwen2.5:14b"
DANILO_AI_FALLBACK_TIER_G="qwen2.5:32b"

DANILO_AI_UNIVERSAL_FALLBACK="llama3.2:3b"

# Compatibility Mapping
DANILO_AI_MODEL_LOW="${DANILO_AI_MODEL_TIER_B}"
DANILO_AI_MODEL_MID="${DANILO_AI_MODEL_TIER_C}"
DANILO_AI_MODEL_BALANCED="${DANILO_AI_MODEL_TIER_C}"
DANILO_AI_MODEL_GPU="${DANILO_AI_MODEL_TIER_D}"
DANILO_AI_MODEL_HIGH="${DANILO_AI_MODEL_TIER_E}"

DANILO_AI_EMBEDDING_MODEL="nomic-embed-text"

# -------------------------
# AI Inference Parameters
# -------------------------
DANILO_AI_TEMP="0.3"
DANILO_AI_TOP_P="0.9"
DANILO_AI_REPEAT_PENALTY="1.1"
DANILO_AI_NUM_PREDICT="220"

# -------------------------
# Hardware Thresholds
# -------------------------
DANILO_RAM_HIGH_THRESHOLD="65536"
DANILO_RAM_MID_THRESHOLD="32768"
DANILO_RAM_LOW_THRESHOLD="16384"
DANILO_VRAM_HIGH_THRESHOLD="24576"
DANILO_VRAM_MID_THRESHOLD="8192"

# -------------------------
# LMS Application Logic
# -------------------------
DANILO_ROLES="admin,teacher,student"
DANILO_LOW_SCORE_THRESHOLD="75.0"
DANILO_ATTENTION_THRESHOLD="80.0"
DANILO_RISK_THRESHOLD="70.0"

# -------------------------
# Security and CORS
# -------------------------
DANILO_DEFAULT_CORS_DOMAINS="http://danilo.apc.edu.ph,http://localhost:5173,http://127.0.0.1:5173"
DANILO_EMAIL_DOMAIN="danilo.apc.edu.ph"
